name: FCN Shared 526-Stock Library Daily Update
on:
  schedule:
    # 09:15 and 11:15 Asia/Taipei; retry delayed US GOOGLEFINANCE closes.
    - cron: '15 1,3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fcn-shared-526-stock-library
  cancel-in-progress: false
jobs:
  update-stock-library:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quote updater dependencies
        run: pip install 'google-auth>=2.30,<3' 'requests>=2.31,<3'
      - name: Update the SAME stock library used by historical trial and live FCN monitoring
        env:
          FCN_PRICE_WRITER_JSON: ${{ secrets.FCN_PRICE_WRITER_JSON }}
        run: python update_stock_prices.py
