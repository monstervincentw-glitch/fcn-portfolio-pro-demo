name: PR3 Focused Model Integration Tests
on:
  push:
    branches: [hotfix/model-overview-principal-20261021]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-model-overview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing test dependencies
        run: python -m pip install -r requirements.txt
      - name: Focused PIN/portfolio/model/price integration regression
        run: |
          python -m pytest -q test_hotfix_model_overview.py test_ko_lifecycle.py test_e2e_acceptance.py test_price_source_p0.py test_v2_redemption.py test_ko_pages.py -k 'not history and not http' --tb=short
